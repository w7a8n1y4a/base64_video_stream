[general]
name = "Base64 Video Stream"
description = "Стримит base64-кодированные кадры видео по `MQTT` через `pepeunit-client`. Поддерживает `UI` с навигацией по библиотеке видео, воспроизведение, паузу, перемотку и случайный порядок. Кадры предварительно обрабатываются (CLAHE, DoG, дизеринг Флойда-Стейнберга) для отображения на монохромных `OLED` дисплеях `128×64`"
language = "Python"
hardware = ["Any-PC"]
stack = ["opencv", "numpy", "pillow", "tqdm", "pepeunit_client"]
version = "1.1.1"
license = "AGPL v3 License"
authors = [
    {name = "Ivan Serebrennikov", email = "admin@silberworks.com"}
]

[images]
example = "https://minio.pepemoss.com/public-data/video/base64_streaming.mp4"

[env_description]
VIDEO_FPS = "Частота кадров видеопотока (кадров в секунду)"
UI_FPS = "Частота обновления UI (кадров в секунду)"
WIDTH = "Ширина кадра в пикселях"
HEIGHT = "Высота кадра в пикселях"
ITEMS_PER_PAGE = "Количество элементов на странице в списке библиотеки"
SEEK_SECONDS = "Шаг перемотки в секундах"


[topic_assignment]
"encoder_action/pepeunit" = "Принимает действие энкодера текстом: `One`, `Double`, `Long` (кнопка) или `Right`, `Left` (вращение)"
"full_frame_stream/pepeunit" = "Отправляет base64-кодированный кадр (исходящий) для отображения на дисплее `SH1106`"

[work_algorithm]
steps = [
  "Подключение к серверу `Pepeunit` по `HTTP`/`HTTPS`",
  "Подключение к `MQTT` брокеру",
  "Сканирование директории `videos/` на наличие `.mp4` файлов",
  "Предварительная обработка видео: конвертация кадров в монохромный формат `128×64` (CLAHE, DoG, дизеринг Флойда-Стейнберга) и кэширование в `frames/` как base64 `.txt` файлы",
  "Отображение UI: экран загрузки → главное меню (`Библиотека`, `Рандом`, `Действия`)",
  "В режиме `Библиотека`: навигация по списку видео, просмотр статуса (`Ready`, `Pending`, `Processing`, `Error`, `Warning`), выбор видео для воспроизведения, возможность запускать дирректории как плей листы - двойным нажатимем кнопки",
  "При двойном нажатии на видео в режиме `Библиотека` можно увидеть более подробную информацию о видео",
  "В режиме `Random`: воспроизведение всех готовых видео в случайном порядке",
  "В режиме `Actions`: очистка кэша `.txt`, просмотр информации о сервисе стриминга",
  "При воспроизведении: последовательная отправка кадров в `full_frame_stream/pepeunit`, поддержка паузы, перемотки (`±SEEK_SECONDS`)",
  "При получении действия в `encoder_action/pepeunit`: обработка навигации по UI и управление воспроизведением",
  "Периодическая синхронизация состояния с сервером `Pepeunit`"
]

[installation]
steps = [
  "Создайте `Unit` в `Pepeunit`",
  "Установите переменные окружения в `Pepeunit`",
  "Скачайте архив c программой из `Pepeunit`",
  "Распакуйте архив в директорию",
  "Установите `uv` в вашу десктоп систему [uv github](https://github.com/astral-sh/uv)",
  "Установите нужные пакеты командой uv sync",
  "Добавляйте свои .mp4 файлы в дирректорию `videos/`, стриминг сам их будет конвертировать в `.txt`",
  "Запустите стриминг при помощи команды uv run python main.py"
]
